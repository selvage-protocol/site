# What the link check does not check, and why.
#
# Nothing is excluded. The waitlist form is gone — the page collects nothing —
# so the reserved-name endpoint went with it, and every link left on the page
# is expected to resolve and is checked. In particular `selvageprotocol.com`
# is not registered yet, so the page carries no canonical link and no Open
# Graph URL pointing at it — there is nothing to exclude because there is
# nothing there. The page is live at `selvage-protocol.vercel.app`, and its
# `og:image` is that origin's own path (see the README's "The live origin"),
# which is why the metadata resolves without the domain. When the domain
# exists, the metadata goes in and nothing comes out of this file.
