name: ci

# The gate for the Next.js page: typecheck, build, the button prop check, the contrast
# floor over the theme tokens, the claim filter over the rendered page, the Content-Security-Policy
# in vercel.json over the same rendered page and the site's own not-found route, the link check
# over the rendered page and the README,
# and the workflow lint. The claim step
# matches known wordings only — a green run is not a proof that every sentence is true, so the
# page's claims are still read against the corpus by a person. The claims it does assert
# positively are the two with artefacts behind them. The image tag the page's happy path hands a
# reader: it asks `ghcr.io` for the pinned version, requires a leg per architecture, and compares
# the per-platform manifests' layer digests, because a platform entry only labels a slot. And the
# demo instance the page points at: it requires every reference to that host to be one of the
# three the page may carry, the address the demo section hands an editor to reach the server
# (its path answers the server's own JSON, not the proxy's page), that address's origin to report a
# `selvaged` server offering a wire version the page names, and the origin's `/` to serve the guest
# page the browser row points at. Both need egress, to the registry and to the instance, and fail
# rather than pass when they cannot reach it.
# No `push: branches: [main]`: a pull request already runs the whole gate, and the
# merge commit carries the same content, so the merge would run it a second time.
# `workflow_dispatch` is the re-run for a commit that reached `main` without one.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # GitHub-hosted, not Blacksmith: Blacksmith runners demonstrably cannot reach nodejs.org
    # (verified 2026-09-15), so setup-node cannot bootstrap there; ubuntu-24.04 has full egress
    # and a preinstalled Node.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The release nixpkgs carries today, so a developer and the runner check with the same
      # binary. The checksum is the one published beside the archive.
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
      ACTIONLINT_VERSION: "1.7.7"
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No package-manager cache: a cold `npm ci` fits the timeout, and one less
          # service in the gate is one less way for a green tree to go red.

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The runner has no nix, so the pinned releases are installed here and `scripts/ci-local.sh`
      # takes lychee and actionlint from PATH. This is the runner's own temp directory, not this
      # host's RAM-backed `/tmp`.
      - name: Install lychee
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo install -m 0755 "$RUNNER_TEMP/lychee" /usr/local/bin/lychee
          lychee --version

      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint --version

      - name: typecheck (tsc --noEmit)
        run: scripts/ci-local.sh typecheck

      - name: build (next build)
        run: scripts/ci-local.sh build

      - name: button props reach the DOM (both variants)
        run: scripts/ci-local.sh button

      - name: contrast floor over the theme tokens (WCAG AA)
        run: scripts/ci-local.sh contrast

      - name: claim filter over the rendered page (known wordings, plus the image and demo pins against the registry and the instance)
        run: scripts/ci-local.sh claims

      - name: the CSP over the served page and its not-found route (nothing either carries is refused)
        run: scripts/ci-local.sh csp

      - name: links over the rendered page and the README
        run: scripts/ci-local.sh links

      - name: lint the workflow
        run: scripts/ci-local.sh lint
